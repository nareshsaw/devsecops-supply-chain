# A NON-compliant deployment used to prove the guardrails block bad changes:
# - uses the :latest tag   - runs privileged as root   - has no resource limits
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insecure-demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: insecure-demo }
  template:
    metadata:
      labels: { app: insecure-demo }
    spec:
      containers:
        - name: app
          image: nginx:latest
          securityContext:
            privileged: true
