apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resource-limits
  annotations:
    policies.kyverno.io/description: Every container must declare CPU/memory requests and a memory limit.
spec:
  validationActions: [Deny]
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: >-
        object.spec.containers.all(c,
          has(c.resources) &&
          has(c.resources.requests) && 'cpu' in c.resources.requests && 'memory' in c.resources.requests &&
          has(c.resources.limits) && 'memory' in c.resources.limits)
      message: "Every container must set CPU and memory requests and a memory limit."
