# A compliant deployment: passes every OPA (conftest) and Kyverno policy
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops-demo
  labels: { app: devsecops-demo }
spec:
  replicas: 2
  selector:
    matchLabels: { app: devsecops-demo }
  template:
    metadata:
      labels: { app: devsecops-demo }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: ghcr.io/nareshsaw/devsecops-supply-chain:1.0.0
          ports: [{ containerPort: 8080 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
